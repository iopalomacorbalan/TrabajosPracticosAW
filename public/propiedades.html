<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propiedades — Frenkel & Llopis Propiedades</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <img src="imagenes/logo_frenkel_paletaB_1.svg" alt="Logo">
        <span>Frenkel & Llopis Propiedades</span>
      </a>
      <nav>
        <a href="index.html">Inicio</a>
        <a href="propiedades.html" class="active">Propiedades</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>
 
  <section class="container section">
    <h1>Propiedades disponibles</h1>
 
    <form id="filtros" class="filtros">
      <select name="operation">
        <option value="">Operación (todas)</option>
        <option value="venta">Venta</option>
        <option value="alquiler">Alquiler</option>
      </select>
 
      <select name="type">
        <option value="">Tipo (todos)</option>
        <option value="casa">Casa</option>
        <option value="departamento">Departamento</option>
        <option value="ph">PH</option>
        <option value="terreno">Terreno</option>
      </select>
 
      <input type="number" name="minPrice" placeholder="Precio mínimo">
      <input type="number" name="maxPrice" placeholder="Precio máximo">
 
      <button type="submit" class="btn">Filtrar</button>
    </form>
 
    <div id="listado" class="grid"></div>
  </section>
 
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Frenkel & Llopis Propiedades — Todos los derechos reservados</p>
    </div>
  </footer>
 
  <script src="js/propiedades.js"></script>
  <script>
    cargarPropiedades("listado");
 
    document.getElementById("filtros").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const params = {};
      for (const [k, v] of form.entries()) {
        if (v) params[k] = v;
      }
      cargarPropiedades("listado", params);
    });
  </script>
</body>
</html>
